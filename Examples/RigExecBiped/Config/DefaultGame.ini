[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=RigExecBiped

[/Script/UnrealEd.ProjectPackagingSettings]
; The character's assets are found by soft path at run time, so the cook is
; told to take them.
+DirectoriesToAlwaysCook=(Path="/Game/RigExec")
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Mannequins")
+MapsToCook=(FilePath="/Game/RigExec/L_RigExecGame")
+MapsToCook=(FilePath="/Game/RigExec/L_RigExecPlatformer")
; The animation studio (RigExecStudioGameMode), opened from the pause menu.
+MapsToCook=(FilePath="/Game/RigExec/L_RigExecStudio")
; The platformer course is built from the engine's basic shapes at run time.
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
; The RigExec plugin's surface material, loaded by path when a character's
; meshes are built (without it a packaged game falls back to a plain colour).
+DirectoriesToAlwaysCook=(Path="/RigExec")
; The Squarebit Eye materials, found by soft path when its plugin is installed.
+DirectoriesToAlwaysCook=(Path="/SquarebitEye")
; The startup splash (Splash.bmp) and the loading screen's picture are read
; from disk before any package is, so they ship as loose files.
+DirectoriesToAlwaysStageAsNonUFS=(Path="Splash")
bUseIoStore=True
BuildConfiguration=PPBC_Development
